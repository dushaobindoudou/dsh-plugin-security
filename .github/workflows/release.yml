name: Publish to npm
# Manual: publishes the tagged source with npm provenance through trusted
# publishing (configure this repository as a trusted publisher on npmjs.com
# first). No npm token is stored in the repository.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.5.0)
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"
      - run: npm publish --provenance --access public
